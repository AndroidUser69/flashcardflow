<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flashcard Flow</title>
    
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        
        /* Utilitários 3D e Scroll */
        
        .perspective-1000 { perspective: 1000px; }
        
        .transform-style-3d { transform-style: preserve-3d; }
        
        .backface-hidden { backface-visibility: hidden; -webkit-backface-visibility: hidden; }
        
        .rotate-y-180 { transform: rotateY(180deg); }
        
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        
        .custom-scroll::-webkit-scrollbar-thumb { background-color: rgba(0,0,0,0.1); border-radius: 20px; }
        
        /* Animações */
        
        @keyframes slideDown { from { transform: translateY(-100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        
        .toast-enter { animation: slideDown 0.3s ease-out forwards; }
        
        /* Helpers */
        
        .select-none-important { user-select: none !important; -webkit-user-select: none !important; }
        
        .cursor-grab { cursor: grab; }
        
        .cursor-grabbing { cursor: grabbing; }
        
        /* Preview do Markdown */
        
        .markdown-preview { color: #374151; line-height: 1.6; }
        
        .markdown-preview h1 { font-size: 1.8em; font-weight: 700; margin-bottom: 0.5em; color: #111827; margin-top: 0.5em; border-bottom: 1px solid #e5e7eb; padding-bottom: 0.2em; }
        
        .markdown-preview h2 { font-size: 1.4em; font-weight: 600; margin-top: 1.2em; margin-bottom: 0.5em; color: #1f2937; }
        
        .markdown-preview h3 { font-size: 1.2em; font-weight: 600; margin-top: 1em; margin-bottom: 0.5em; }
        
        .markdown-preview p { margin-bottom: 1em; }
        
        .markdown-preview ul { list-style-type: disc; padding-left: 1.5em; margin-bottom: 1em; }
        
        .markdown-preview ol { list-style-type: decimal; padding-left: 1.5em; margin-bottom: 1em; }
        
        .markdown-preview li { margin-bottom: 0.25em; }
        
        .markdown-preview blockquote { border-left: 4px solid #e5e7eb; padding-left: 1em; color: #6b7280; margin-bottom: 1em; font-style: italic; background-color: #f9fafb; padding: 0.5em 1em; border-radius: 0 4px 4px 0; }
        
        .markdown-preview code { background-color: #f3f4f6; padding: 0.2em 0.4em; border-radius: 0.25em; font-size: 0.9em; font-family: monospace; color: #dc2626; }
        
        .markdown-preview pre { background-color: #1f2937; color: #f3f4f6; padding: 1em; border-radius: 0.5em; overflow-x: auto; margin-bottom: 1em; }
        
        .markdown-preview pre code { background-color: transparent; color: inherit; padding: 0; }
        
        .markdown-preview a { color: #2563eb; text-decoration: underline; }
        
        .markdown-preview hr { margin: 2em 0; border-top: 1px solid #e5e7eb; }
        
        .markdown-preview table { width: 100%; border-collapse: collapse; margin-bottom: 1em; }
        
        .markdown-preview th, .markdown-preview td { border: 1px solid #e5e7eb; padding: 0.5em; text-align: left; }
        
        .markdown-preview th { background-color: #f9fafb; font-weight: 600; }
        
        .markdown-preview strong { font-weight: 700; color: #111827; }
        
        /* Estilos de Realce */
        
        mark[data-highlight-id] { transition: opacity 0.2s; position: relative; border-radius: 2px; }
        
        .mode-highlight mark[data-highlight-id] { cursor: pointer; }
        
        .mode-highlight mark[data-highlight-id]:hover { opacity: 0.8; box-shadow: 0 0 0 1px rgba(0,0,0,0.2); }
    </style>
