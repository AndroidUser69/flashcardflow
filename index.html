<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flashcard Flow</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- TEMA NOTURNO: `darkMode: 'class'` faz as classes `dark:` do projeto
         valerem quando a tag <html> tem a classe `.dark` (ver src/utils/theme.js). -->
    <script>
      tailwind.config = { darkMode: 'class' };
    </script>
    <!-- Aplica o tema ANTES de pintar a tela (evita o "flash" claro).
         Só existem dois temas: Claro (padrão) ou Noturno. O modo "Automático"
         (seguir o sistema) foi retirado — valores antigos caem no Claro. -->
    <script>
      (function () {
        try {
          var modo = localStorage.getItem('ff_theme');
          var escuro = modo === 'dark';
          var r = document.documentElement;
          r.classList.toggle('dark', escuro);
          r.setAttribute('data-theme', escuro ? 'dark' : 'light');
          r.style.colorScheme = escuro ? 'dark' : 'light';
        } catch (e) { /* segue no claro */ }
      })();
    </script>

    <script src="https://unpkg.com/pdfjs-dist@3.4.120/build/pdf.js"></script>
    <script src="https://unpkg.com/pdfjs-dist@3.4.120/web/pdf_viewer.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/pdfjs-dist@3.4.120/web/pdf_viewer.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        
        /* Utilitários 3D e Scroll */
        
        .perspective-1000 { perspective: 1000px; }
        
        .transform-style-3d { transform-style: preserve-3d; }
        
        .backface-hidden { backface-visibility: hidden; -webkit-backface-visibility: hidden; }
        
        .rotate-y-180 { transform: rotateY(180deg); }
        
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        
        .custom-scroll::-webkit-scrollbar-thumb { background-color: rgba(0,0,0,0.1); border-radius: 20px; }
        
        /* Scrollbar horizontal para a toolbar responsiva */
        
        .custom-scroll-header::-webkit-scrollbar { height: 3px; }
        
        .custom-scroll-header::-webkit-scrollbar-track { background: transparent; }
        
        .custom-scroll-header::-webkit-scrollbar-thumb { background-color: rgba(0,0,0,0.08); border-radius: 10px; }
        
        .custom-scroll-header { -ms-overflow-style: none; scrollbar-width: thin; }
        
        /* Animações */
        
        @keyframes slideDown { from { transform: translateY(-100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        
        .toast-enter { animation: slideDown 0.3s ease-out forwards; }
        
        /* Rótulo de menu que NÃO CABE: em vez de esticar o menu, o nome desliza
           (marquee) para a esquerda revelando o resto e volta ao início.
           `--slide` é a sobra em pixels, medida pelo JS de quem usa a classe. */
        
        @keyframes menuLabelSlide {
            0%, 12% { transform: translateX(0); }
            45%, 58% { transform: translateX(var(--slide, 0px)); }
            92%, 100% { transform: translateX(0); }
        }
        
        .menu-label-slide { animation: menuLabelSlide 6.5s ease-in-out infinite; }
        
        @media (prefers-reduced-motion: reduce) {
            .menu-label-slide { animation: none; }
        }
        
        /* Helpers */
        
        .select-none-important { user-select: none !important; -webkit-user-select: none !important; }
        
        .cursor-grab { cursor: grab; }
        
        .cursor-grabbing { cursor: grabbing; }
        
        /* Preview do Markdown */
        
        .markdown-preview { color: #374151; line-height: 1.6; }
        
        .markdown-preview h1 { font-size: 1.8em; font-weight: 700; margin-bottom: 0.5em; color: #111827; margin-top: 0.5em; border-bottom: 1px solid #e5e7eb; padding-bottom: 0.2em; }
        
        .markdown-preview h2 { font-size: 1.4em; font-weight: 600; margin-top: 1.2em; margin-bottom: 0.5em; color: #1f2937; }
        
        .markdown-preview h3 { font-size: 1.2em; font-weight: 600; margin-top: 1em; margin-bottom: 0.5em; }
        
        .markdown-preview p { margin-bottom: 1em; }
        
        .markdown-preview ul { list-style-type: disc; padding-left: 1.5em; margin-bottom: 1em; }
        
        .markdown-preview ol { list-style-type: decimal; padding-left: 1.5em; margin-bottom: 1em; }
        
        .markdown-preview li { margin-bottom: 0.25em; }
        
        .markdown-preview blockquote { border-left: 4px solid #e5e7eb; padding-left: 1em; color: #6b7280; margin-bottom: 1em; font-style: italic; background-color: #f9fafb; padding: 0.5em 1em; border-radius: 0 4px 4px 0; }
        
        .markdown-preview code { background-color: #f3f4f6; padding: 0.2em 0.4em; border-radius: 0.25em; font-size: 0.9em; font-family: monospace; color: #dc2626; }
        
        .markdown-preview pre { background-color: #1f2937; color: #f3f4f6; padding: 1em; border-radius: 0.5em; overflow-x: auto; margin-bottom: 1em; }
        
        .markdown-preview pre code { background-color: transparent; color: inherit; padding: 0; }
        
        /* Imagem também não pode "empurrar" a nota para o lado */
        
        .markdown-preview img { max-width: 100%; height: auto; }
        
        .markdown-preview a { color: #2563eb; text-decoration: underline; }
        
        .markdown-preview hr { margin: 2em 0; border-top: 1px solid #e5e7eb; }
        
        /* Tabela se ADAPTA à largura da nota: o texto das células quebra linha
           (inclusive palavras longas/URLs), então não precisa rolar para o lado.
           O invólucro .tabela-rolavel fica apenas como rede de segurança para
           casos extremos (muitas colunas), evitando que a NOTA inteira role. */
        
        .markdown-preview table { width: 100%; table-layout: auto; border-collapse: collapse; margin-bottom: 1em; }
        
        .tabela-rolavel { max-width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; margin-bottom: 1em; }
        
        .tabela-rolavel > table { margin-bottom: 0; }
        
        .markdown-preview th, .markdown-preview td { border: 1px solid #e5e7eb; padding: 0.5em; text-align: left; overflow-wrap: anywhere; word-break: break-word; }
        
        /* Tela estreita: células mais enxutas => mais colunas cabem sem rolar */
        
        @media (max-width: 640px) {
            .markdown-preview th, .markdown-preview td { padding: 0.35em 0.45em; font-size: 0.95em; }
        }
        
        .markdown-preview th { background-color: #f9fafb; font-weight: 600; }
        
        .markdown-preview strong { font-weight: 700; color: #111827; }
        
        /* Modo VISUAL do editor (estilo Word): a "folha" onde se digita o texto
           já formatado. Usa as mesmas classes .markdown-preview, então o que se
           vê ao editar é igual ao que se vê ao ler. */
        
        .rich-editor { outline: none; word-break: break-word; }
        
        .rich-editor:focus { outline: none; }
        
        .rich-editor:empty::before { content: attr(data-placeholder); color: #9ca3af; pointer-events: none; }
        
        /* Fórmulas são "átomos": não se digita dentro do KaTeX */
        
        .rich-editor [contenteditable="false"] { user-select: none; -webkit-user-select: none; cursor: default; }
        
        /* Células da tabela: sempre clicáveis e com largura mínima (como no Word) */
        
        .rich-editor table { cursor: text; }
        
        .rich-editor th, .rich-editor td { min-width: 56px; min-height: 1.4em; }
        
        .rich-editor th:empty::after, .rich-editor td:empty::after { content: "\200b"; }
        
        /* Bloco de código: na edição é melhor quebrar linha do que rolar de lado */
        
        .rich-editor pre { white-space: pre-wrap; overflow-x: visible; }
        
        /* LaTeX (KaTeX) — fórmulas dentro do Markdown */
        
        .markdown-preview .latex-math { padding: 0 1px; border-radius: 3px; }
        
        .markdown-preview .latex-math .katex { font-size: 1.05em; }
        
        .markdown-preview .latex-math-block {
            display: block;
            text-align: center;
            margin: 0.9em 0;
            overflow-x: auto;
            overflow-y: hidden;
        }
        
        .markdown-preview .latex-math-block .katex-display { margin: 0; }
        
        .markdown-preview .latex-math-error { color: inherit; }
        
        /* Fórmula em bloco com colchete: etiqueta abaixo não pode ser cortada */
        
        .markdown-preview .latex-math-block.bracket-highlight { overflow: visible; }
        
        @media print {
            .latex-math-block { overflow: visible !important; }
        }
        
        /* Estilos de Realce */
        
        mark[data-highlight-id] { transition: opacity 0.2s; position: relative; border-radius: 2px; }
        
        .mode-highlight mark[data-highlight-id] { cursor: pointer; }
        
        .mode-highlight mark[data-highlight-id]:hover { opacity: 0.8; box-shadow: 0 0 0 1px rgba(0,0,0,0.2); }
        
        /* ====================================================================
           PONTE DO TEMA NOTURNO (html.dark)
           O Tailwind é carregado via CDN, então as classes `dark:` do projeto
           funcionam normalmente. Este bloco cobre o "resto" do app (telas já
           existentes que ainda não têm classes dark:), remapeando as
           utilidades claras mais usadas para uma paleta escura confortável.
           Usar `html.dark .classe` garante especificidade maior que a classe
           gerada pelo Tailwind (que é injetada depois deste <style>).
           ==================================================================== */
        
        html.dark body { background-color: #0f1720; color: #e8edf5; }
        
        /* Superfícies */
        
        html.dark .bg-white { background-color: #1b2536; }
        
        html.dark .bg-white\/90 { background-color: rgba(27, 37, 54, 0.93); }
        
        html.dark .bg-white\/80 { background-color: rgba(27, 37, 54, 0.82); }
        
        html.dark .bg-white\/25 { background-color: rgba(255, 255, 255, 0.22); }
        
        html.dark .bg-white\/20 { background-color: rgba(255, 255, 255, 0.18); }
        
        html.dark .bg-white\/15 { background-color: rgba(255, 255, 255, 0.14); }
        
        html.dark .bg-gray-50, html.dark .bg-gray-50\/70 { background-color: #16202e; }
        
        html.dark .bg-gray-50\/50 { background-color: rgba(22, 32, 46, 0.55); }
        
        html.dark .bg-gray-100 { background-color: #223044; }
        
        html.dark .bg-gray-100\/60 { background-color: rgba(34, 48, 68, 0.6); }
        
        html.dark .bg-gray-200 { background-color: #2c3a4f; }
        
        html.dark .bg-gray-300 { background-color: #3b4b63; }
        
        html.dark .bg-black\/50 { background-color: rgba(2, 6, 12, 0.65); }
        
        html.dark .bg-black\/45 { background-color: rgba(2, 6, 12, 0.55); }
        
        /* Textos */
        
        html.dark .text-gray-900, html.dark .text-gray-800 { color: #f1f5f9; }
        
        html.dark .text-gray-700 { color: #e3e9f2; }
        
        html.dark .text-gray-600 { color: #cbd5e1; }
        
        html.dark .text-gray-500 { color: #a7b3c6; }
        
        html.dark .text-gray-400 { color: #8e9cb0; }
        
        html.dark .text-gray-300 { color: #6f7d92; }
        
        html.dark .text-black { color: #e8edf5; }
        
        /* Bordas e divisores */
        
        html.dark .border-gray-50 { border-color: rgba(255, 255, 255, 0.06); }
        
        html.dark .border-gray-100 { border-color: rgba(255, 255, 255, 0.09); }
        
        html.dark .border-gray-200 { border-color: rgba(255, 255, 255, 0.13); }
        
        html.dark .border-gray-300 { border-color: rgba(255, 255, 255, 0.18); }
        
        html.dark .divide-gray-50 > :not([hidden]) ~ :not([hidden]) { border-color: rgba(255, 255, 255, 0.07); }
        
        html.dark .divide-gray-100 > :not([hidden]) ~ :not([hidden]) { border-color: rgba(255, 255, 255, 0.1); }
        
        html.dark .divide-gray-200 > :not([hidden]) ~ :not([hidden]) { border-color: rgba(255, 255, 255, 0.13); }
        
        /* Hovers mais usados */
        
        html.dark .hover\:bg-gray-50:hover { background-color: #223044; }
        
        html.dark .hover\:bg-gray-100:hover { background-color: #223044; }
        
        html.dark .hover\:bg-gray-200:hover { background-color: #2c3a4f; }
        
        html.dark .hover\:bg-white:hover { background-color: #223044; }
        
        html.dark .hover\:text-gray-600:hover { color: #e3e9f2; }
        
        html.dark .hover\:text-gray-700:hover { color: #f1f5f9; }
        
        html.dark .hover\:text-gray-800:hover { color: #f8fafc; }
        
        html.dark .hover\:border-gray-300:hover { border-color: rgba(255, 255, 255, 0.25); }
        
        html.dark .hover\:bg-blue-50\/50:hover, html.dark .hover\:bg-blue-50\/40:hover, html.dark .hover\:bg-blue-50:hover { background-color: rgba(59, 130, 246, 0.14); }
        
        /* Anéis de destaque (tile da disciplina aberta): o "ring-offset" claro
           criaria um halo branco em volta do cartão no tema escuro. */
        
        html.dark .ring-offset-gray-50, html.dark .ring-offset-gray-100 { --tw-ring-offset-color: #0f1720; }
        
        html.dark .ring-gray-100 { --tw-ring-color: rgba(255, 255, 255, 0.08); }
        
        html.dark .ring-gray-200 { --tw-ring-color: rgba(255, 255, 255, 0.12); }
        
        /* Formulários */
        
        html.dark input:not([type="checkbox"]):not([type="radio"]):not([type="range"]),
        html.dark textarea, html.dark select { color: #e8edf5; }
        
        html.dark input::placeholder, html.dark textarea::placeholder { color: #7b8899; }
        
        html.dark select option { background-color: #1b2536; color: #e8edf5; }
        
        /* Barra de rolagem */
        
        html.dark .custom-scroll::-webkit-scrollbar-thumb,
        html.dark .custom-scroll-header::-webkit-scrollbar-thumb { background-color: rgba(255, 255, 255, 0.16); }
        
        /* Rodapés/barras fixas com sombra clara */
        
        /* ------------------------------------------------------------------
           Selos/pílulas coloridas (badges) e materiais de apoio
           Os tons -50/-100 claros viram uma "película" translúcida da cor,
           e os textos -600/-700/-800 ficam mais claros para dar contraste.
           ------------------------------------------------------------------ */
        
        html.dark .bg-red-50, html.dark .bg-red-100 { background-color: rgba(239, 68, 68, 0.18); }
        
        html.dark .bg-orange-50, html.dark .bg-orange-100 { background-color: rgba(249, 115, 22, 0.18); }
        
        html.dark .bg-amber-50, html.dark .bg-amber-100 { background-color: rgba(245, 158, 11, 0.18); }
        
        html.dark .bg-yellow-50, html.dark .bg-yellow-100 { background-color: rgba(234, 179, 8, 0.18); }
        
        html.dark .bg-green-50, html.dark .bg-green-100 { background-color: rgba(34, 197, 94, 0.18); }
        
        html.dark .bg-emerald-50, html.dark .bg-emerald-100 { background-color: rgba(16, 185, 129, 0.18); }
        
        html.dark .bg-teal-50, html.dark .bg-teal-100 { background-color: rgba(20, 184, 166, 0.18); }
        
        html.dark .bg-cyan-50, html.dark .bg-cyan-100 { background-color: rgba(6, 182, 212, 0.18); }
        
        html.dark .bg-sky-50, html.dark .bg-sky-100 { background-color: rgba(14, 165, 233, 0.18); }
        
        html.dark .bg-blue-50, html.dark .bg-blue-100 { background-color: rgba(59, 130, 246, 0.18); }
        
        html.dark .bg-indigo-50, html.dark .bg-indigo-100 { background-color: rgba(99, 102, 241, 0.18); }
        
        html.dark .bg-violet-50, html.dark .bg-violet-100 { background-color: rgba(139, 92, 246, 0.18); }
        
        html.dark .bg-purple-50, html.dark .bg-purple-100 { background-color: rgba(168, 85, 247, 0.18); }
        
        html.dark .bg-fuchsia-50, html.dark .bg-fuchsia-100 { background-color: rgba(217, 70, 239, 0.18); }
        
        html.dark .bg-pink-50, html.dark .bg-pink-100 { background-color: rgba(236, 72, 153, 0.18); }
        
        html.dark .bg-rose-50, html.dark .bg-rose-100 { background-color: rgba(244, 63, 94, 0.18); }
        
        html.dark .text-red-600, html.dark .text-red-700, html.dark .text-red-800 { color: #fca5a5; }
        
        html.dark .text-orange-700, html.dark .text-orange-800 { color: #fdba74; }
        
        html.dark .text-amber-700, html.dark .text-amber-800 { color: #fcd34d; }
        
        html.dark .text-yellow-700, html.dark .text-yellow-800 { color: #fde047; }
        
        html.dark .text-green-700, html.dark .text-green-800 { color: #86efac; }
        
        html.dark .text-emerald-700 { color: #6ee7b7; }
        
        html.dark .text-teal-700 { color: #5eead4; }
        
        html.dark .text-cyan-700 { color: #67e8f9; }
        
        html.dark .text-sky-700 { color: #7dd3fc; }
        
        html.dark .text-blue-600, html.dark .text-blue-700 { color: #93c5fd; }
        
        html.dark .text-indigo-600, html.dark .text-indigo-700 { color: #a5b4fc; }
        
        html.dark .text-violet-600, html.dark .text-violet-700 { color: #c4b5fd; }
        
        html.dark .text-purple-600, html.dark .text-purple-700 { color: #d8b4fe; }
        
        html.dark .text-fuchsia-700 { color: #f0abfc; }
        
        html.dark .text-pink-700, html.dark .text-pink-600 { color: #f9a8d4; }
        
        html.dark .text-rose-700 { color: #fda4af; }
        
        /* ------------------------------------------------------------------
           Leitura de notas/markdown no escuro (as cores são fixas em hex no
           CSS acima, então precisam ser reescritas uma a uma)
           ------------------------------------------------------------------ */
        
        html.dark .markdown-preview { color: #d7dee8; }
        
        html.dark .markdown-preview h1 { color: #f8fafc; border-bottom-color: rgba(255, 255, 255, 0.14); }
        
        html.dark .markdown-preview h2, html.dark .markdown-preview h3 { color: #f1f5f9; }
        
        html.dark .markdown-preview strong { color: #f8fafc; }
        
        html.dark .markdown-preview a { color: #7dd3fc; }
        
        html.dark .markdown-preview blockquote { border-left-color: rgba(255, 255, 255, 0.16); color: #a7b3c6; background-color: rgba(255, 255, 255, 0.04); }
        
        html.dark .markdown-preview code { background-color: rgba(255, 255, 255, 0.1); color: #fca5a5; }
        
        html.dark .markdown-preview th { background-color: rgba(255, 255, 255, 0.05); }
        
        html.dark .markdown-preview th, html.dark .markdown-preview td { border-color: rgba(255, 255, 255, 0.13); }
        
        html.dark .markdown-preview hr { border-top-color: rgba(255, 255, 255, 0.14); }
        
        html.dark .rich-editor:empty::before { color: #7b8899; }
        
        /* Realces: o texto do realce herda a cor clara do tema. NÃO forçamos cor
           aqui, porque o fundo do realce é uma camada translúcida da cor
           escolhida pelo usuário (amarelo, verde…) — texto claro sobre ela
           continua legível e o realce não "queima" a vista. */
        
        html.dark .katex { color: inherit; }
    </style>
